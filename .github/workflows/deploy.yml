name: test-and-deploy
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read, id-token: write }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && pytest -q

  deploy:                                  # only on main, after tests pass
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest                 # builds linux/amd64, so Apple-silicon Macs are not an issue
    env: { REGION: us-central1 }
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2          # keyless login (Workload Identity Federation)
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet
      - name: Build, push, deploy
        run: |
          IMG=${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/retailiq/api:${{ github.sha }}
          docker build -t "$IMG" .
          docker push "$IMG"
          gcloud run deploy retailiq --image "$IMG" --region "$REGION" --project "${{ secrets.GCP_PROJECT }}"
